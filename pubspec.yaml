name: agency_user_app
description: "A single shared codebase Flutter project for Office Manager."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1
  dio: ^5.4.1
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^13.2.0
  intl: ^0.19.0
  logger: ^2.1.0
  google_fonts: ^6.1.0
  image_picker: ^1.1.2
  record: 5.1.2           # Real microphone recording (pinned stable build)
  just_audio: ^0.10.4     # Audio playback
  permission_handler: ^11.3.1 # Runtime mic permission
  path_provider: ^2.1.2   # Temp dir for voice recordings
  url_launcher: ^6.2.5    # PDF Invoice Download and viewing

dependency_overrides:
  record_platform_interface: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
